<style>

<script>
/* ============ helpers ============ */
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=n=>`<i data-lucide="${n}"></i>`,draw=()=>{try{lucide.createIcons()}catch(e){}},enc=encodeURIComponent,
ST=['new','messaged','replied','interested','not_interested','bad_number','do_not_contact'],GRAB='<div class="grab"></div>',D1=$('#dlg'),D2=$('#dlg2');
const TABS=[['dash','layout-dashboard','Home'],['leads','users','Leads'],['find','search','Find'],['runs','history','Runs'],['send','send','Send'],['set','settings','Settings']];
const sk=(w,h,x='')=>`<span class="sk" style="width:${w};height:${h};${x}"></span>`;
const skRows=n=>Array.from({length:n},(_,i)=>`<div class="skrow">${sk('42px','42px','border-radius:14px')}<div style="flex:1">${sk([62,48,70,55,66,44,58][i%7]+'%','14px','display:block;margin-bottom:6px')}${sk('38%','11px','display:block')}</div>${sk('34px','20px')}</div>`).join('');
const head=(t,s,a='')=>`<div class="top"><div><h1>${t}</h1><div class="sub">${s}</div></div>${a}</div>`;
function paint(el,h,nd){if(!el||el._h===h)return;el._h=h;el.innerHTML=h;if(!nd)draw()}
function setv(id,v){const e=$('#'+id);if(!e)return;e.classList.remove('sk');e.removeAttribute('style');e.textContent=v}
const initial=n=>esc(((n||'')[0]||'?').toUpperCase());
function toast(m,u){const t=$('#toast');window._u=u;t.innerHTML=esc(m)+(u?' <button data-a="undo">Undo</button>':'');t.classList.add('on');try{if(t.matches(':popover-open'))t.hidePopover();t.showPopover()}catch(e){}clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove('on'),u?6000:2600)}

/* ============ network + cache ============ */
let tab='',PT=0,PA=null,PK=0,DS=0,RT=0,LV=0;
const C=new Map(),INF=new Map(),SC={},INIT={};
async function api(p,m='GET',b,o={}){
 let r;try{r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined,signal:o.signal})}
 catch(e){if(e&&e.name=='AbortError')throw 0;throw new Error('Network error. Check your connection.')}
 if(r.status==401){$('#login').hidden=false;$('#wpill').hidden=true;clearTimeout(SPT);stopPoll();throw 0}if(r.status==204)return null;
 let j=null;try{j=await r.json()}catch(e){}
 if(!r.ok)throw new Error((j&&j.error)||'Something went wrong');return j}
function fetchC(p,o={}){
 const run=async()=>{const d=await api(p,'GET',null,{signal:o.signal}),s=JSON.stringify(d),c=C.get(p),changed=!c||c.s!==s;C.set(p,{d,s,t:Date.now(),x:false});if(p.startsWith('leads?')){LV++;pruneLeads()}return{d,changed}};
 if(o.signal)return run();
 if(INF.has(p))return INF.get(p);
 const pr=run().finally(()=>INF.delete(p));INF.set(p,pr);return pr}
async function swr(p,o){
 const c=C.get(p);let shown=false;
 if(c){o.render(c.d,true);shown=true;if(!c.x&&Date.now()-c.t<(o.ttl??20000))return c.d}
 const r=await fetchC(p,{signal:o.signal});
 if(o.ok&&!o.ok())return r.d;
 if(!shown||r.changed)o.render(r.d,false);return r.d}
function put(p,d){const c=C.get(p);C.set(p,{d,s:JSON.stringify(d),t:c?c.t:Date.now(),x:c?c.x:false});if(p.startsWith('leads?'))LV++}
const stale=re=>{for(const[k,c]of C)if(re.test(k))c.x=true};
const afterMut=()=>stale(/^(stats|queue|leads)/),afterJob=()=>stale(/^(stats|queue|leads|runs|settings)/);
function pruneLeads(){const ks=[...C].filter(([k])=>k.startsWith('leads?')).sort((a,b)=>a[1].t-b[1].t);while(ks.length>12)C.delete(ks.shift()[0])}
function patchLeadCaches(id,patch){id=String(id);
 for(const[k,c]of C){if(k.startsWith('leads?')&&c.d&&c.d.items){let hit=0;const items=c.d.items.map(l=>String(l.id)==id?(hit=1,Object.assign({},l,patch)):l);if(hit)put(k,Object.assign({},c.d,{items}))}
  else if(k=='leads/'+enc(id)&&c.d)put(k,Object.assign({},c.d,patch))}
 const m=LP.items.findIndex(l=>String(l.id)==id);if(m>=0)LP.items[m]=Object.assign({},LP.items[m],patch)}
function dropLead(id){id=String(id);const snap=LP.items.slice(),tot=LP.total;LP.items=LP.items.filter(l=>String(l.id)!=id);LP.total=Math.max(0,LP.total-1);
 for(const k of[...C.keys()])if(k.startsWith('leads?'))C.delete(k);return[snap,tot]}
function findLead(id){id=String(id);return LP.items.find(l=>String(l.id)==id)||null}

/* ============ polling (single, abortable; ms may be a number or a function) ============ */
function stopPoll(){clearTimeout(PT);if(PA)PA.abort();PA=null;PK++}
function poller(fn,ms,now){stopPoll();const k=PK,ac=PA=new AbortController(),dl=()=>typeof ms=='function'?ms():ms;
 const tick=async()=>{if(k!==PK)return;if(document.hidden){PT=setTimeout(tick,Math.max(dl(),15000));return}let again=false;try{again=await fn(ac.signal)}catch(e){}if(k===PK&&again)PT=setTimeout(tick,dl())};
 PT=setTimeout(tick,now?0:dl())}

function pollStatus(){clearTimeout(SPT);if(!$('#login').hidden)return;if(SPB){SPQ=1;return}SPB=1;
 api('wa/status').then(applyStatus).catch(()=>{}).finally(()=>{SPB=0;if(SPQ){SPQ=0;pollStatus();return}if($('#login').hidden)SPT=setTimeout(pollStatus,stMs())})}

function applyStatus(s){if(!s)return;WST=Object.assign({},s,{loaded:1});WS=s.status;BUSY=s.busy||null;
 if(SV&&SV.running&&BUSY!='send'&&Date.now()-(SV.t0||0)>6000)endSend();
 if(JR&&!BUSY&&Date.now()-JT>6000){JR=false;afterJob();if(tab=='find')poller(poll,3000,true)}
 if(tab=='find'&&BUSY=='find'&&!JR)poller(poll,3000,true);
 if(tab=='send'&&BUSY=='send'&&!(SV&&SV.running)){SJV=-1;poller(pollSend,SMS,true)}
 paintPill();paintBanner();drawIf();if(tab=='set')paintConn();if(tab=='find')updFind()}
function paintPill(){const p=$('#wpill');if(!p)return;if(!WST.loaded||!$('#login').hidden){p.hidden=true;return}
 const m={ready:'WhatsApp connected',qr:'Scan QR',starting:'Starting...',error:'WhatsApp error'};
 p.hidden=false;p.className=WST.status=='ready'?'':'warn';
 paint(p,`<span class="dot"></span>${esc(m[WST.status]||'Checking...')}${BUSY=='find'?' · searching':BUSY=='send'?' · sending':''}`,1)}
function paintBanner(){const b=$('#d-ban');if(!b)return;if(!WST.loaded){paint(b,'',1);return}
 const ok=WST.status=='ready',L={ready:'WhatsApp connected',qr:'WhatsApp needs a QR scan',starting:'WhatsApp is starting',error:'WhatsApp error'}[WST.status]||'Checking WhatsApp',
 t=BUSY=='send'?'A WhatsApp send is running':BUSY=='find'?'A search is running':L,
 sub=BUSY?L:ok?'Ready to send or search':'Tap Fix to open Settings',dst=BUSY=='send'?'send':BUSY=='find'?'find':'set';
 paint(b,`<div class="glass pad" style="margin-bottom:14px;display:flex;gap:12px;align-items:center${ok||BUSY?'':';background:#fbe6cf'}">${BUSY?'<div class="spinner"></div>':ic(ok?'check-circle-2':'alert-triangle')}<div style="flex:1;min-width:0"><b>${t}</b><div class="sub">${esc(sub)}</div></div><button class="btn soft sm" data-a="go" data-v="${dst}">${BUSY?'View':ok?'Open':'Fix'}</button></div>`)}
function endSend(){SV=Object.assign({},SV,{running:false});drawIf();
 api('send/job?v=-1').then(j=>{if(j)SV=Object.assign({},j,{running:false});sendDone(SV);drawIf()}).catch(()=>sendDone(SV))}
function sendDone(j){j=j||{};afterMut();stale(/^runs/);
 toast(`Send finished: ${j.sent||0} sent, ${j.unconfirmed||0} unconfirmed, ${j.failed||0} failed`);

 <button class="btn ghost sm rowact" aria-label="Delete" data-a="del" data-id="${id}">${ic('trash-2')}</button><span class="chev">${ic('chevron-right')}</span>`)};
function renderLeads(){const ll=$('#ll'),lkx=$('#lk'),M=ll._m||(ll._m=new Map()),d=LP.items;ll.classList.remove('busy');

 lkx.hidden=true;ll.hidden=false;const seen=new Set();

function applyFirst(d,key){
 if(LP.key===key&&LP.items.length>PS){const seen=new Set(d.items.map(l=>String(l.id)));LP.items=d.items.concat(LP.items.slice(PS).filter(l=>!seen.has(String(l.id))))}   // keep pages already scrolled in

 LP.key=key;LP.total=d.total;LP.more=LP.items.length<d.total;renderLeads()}

  showSheet(GRAB+`<div style="border-radius:14px;overflow:hidden;background:#000">${m.type.startsWith('video')?`<video src="${u}" controls playsinline style="width:100%;max-height:60vh"></video>`:`<img src="${u}" alt="" style="width:100%;max-height:60vh;object-fit:contain">`}</div><p class="sub" style="margin:10px 0">${esc(m.name)} · ${mb(m.size)}</p><button class="btn soft block" data-a="close">Close</button>`,0);openDlg(D2)},
 ins:e=>{const t=$('#tp');if(!t)return;const s=t.selectionStart??t.value.length;t.setRangeText('{'+e.dataset.v+'}',s,t.selectionEnd??s,'end');t.focus()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id=='mfile'){const f=[...t.files];t.value='';upMedia(f)}});
document.addEventListener('toggle',e=>{if(e.target.id=='mdet')MO=e.target.open},true);
document.addEventListener('change',e=>{if(e.target.id=='bst'&&e.target.value)bulk('status',e.target.value)});
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f)f(el,e)});
document.addEventListener('change',e=>{const t=e.target;
 if(t.matches&&t.matches('select[data-a="st"]'))upd(t.dataset.id,t.value);
 else if(t.id=='adskip'){AD.skip=t.checked?1:0;adUpdate()}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.closest('#adc')){const row=t.closest('.brow');if(t.dataset.f&&row){const r=AD.rows[+row.dataset.i];if(r)r[t.dataset.f]=t.value;adSched()}else if(t.id=='adbulk'){AD.bulk=t.value;adSched()}}
 else if(t.closest('#p-find'))keep()});

/* ============ MEDIA ============ */
const MT={'image/jpeg':5,'image/png':5,'image/webp':5,'video/mp4':16,'video/3gpp':16},MAXF=10,MAXT=100*1048576;let MU=0;
const mb=n=>(n/1048576).toFixed(1)+' MB',setMC=fn=>{const c=C.get('media');c&&put('media',fn(c.d))};
let ML=[],MO=0;const mon=()=>ML.filter(m=>m.on);
function fillMedia(L){ML=L||[];if(tab=='send'&&QM.loaded)drawSend();const el=$('#mf');if(!el||MU)return;
 const tot=ML.reduce((a,m)=>a+m.size,0);
 paint(el,`<details id="mdet" ${MO?'open':''}><summary class="msum">${ic('images')}<b>Media</b><span class="sub">${ML.length?`${mon().length} of ${ML.length} on · ${mb(tot)}`:'None yet'}</span><span class="chev" style="display:block;margin-left:auto">${ic('chevron-down')}</span></summary>
 <div class="mg">${ML.map(m=>`<div class="mt ${m.on?'':'off'}" data-a="mprev" data-id="${esc(m.id)}">${m.type.startsWith('video')?`<div class="vd">${ic('play-circle')}</div>`:`<img loading="lazy" src="/api/media/${esc(m.id)}/file" alt="">`}<span class="cb ${m.on?'on':''}" data-a="mtog" data-id="${esc(m.id)}"></span><button class="x" data-a="rmmedia" data-id="${esc(m.id)}" aria-label="Delete">${ic('x')}</button></div>`).join('')}
 ${ML.length<MAXF?`<label class="mt add">${ic('plus')}<input id="mfile" type="file" multiple hidden accept="image/jpeg,image/png,image/webp,video/mp4,video/3gpp"></label>`:''}</div>
 <div id="mup" hidden style="margin-top:12px"><div class="bar"><i id="mbar" style="width:0"></i></div><p class="sub" id="mtx" style="margin:6px 0 0"></p></div>
 <p class="sub" style="margin:10px 0 0">Ticked files go with every message. Tap one to preview.</p></details>`)}
function upOne(f,onp){return new Promise((res,rej)=>{const fd=new FormData();fd.append('file',f);const x=new XMLHttpRequest();x.open('POST','/api/media');
 x.upload.onprogress=e=>e.lengthComputable&&onp(e.loaded/e.total);x.onerror=()=>rej(new Error('Network error'));
 x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}if(x.status==401){$('#login').hidden=false;return rej(0)}x.status>=400?rej(new Error(j.error||'Upload failed')):res(j)};x.send(fd)})}
const upMedia=async files=>{files=[...files];if(!files.length||MU)return;const L=(C.get('media')||{d:[]}).d;let n=L.length,tot=L.reduce((a,m)=>a+m.size,0),ok=[];for(const f of files){const lim=MT[f.type];if(!lim){toast(`${f.name}: use JPG, PNG, WebP, MP4 or 3GP`);continue}if(f.size>lim*1048576){toast(`${f.name}: must be under ${lim} MB`);continue}if(n>=MAXF){toast(`Limit is ${MAXF} files`);break}if(tot+f.size>MAXT){toast('Library is full (100 MB)');break}ok.push(f);n++;tot+=f.size}if(!ok.length)return;MU=MO=1;const dt=$('#mdet');dt&&(dt.open=true);$('#mup').hidden=false;let added=0;for(let i=0;i<ok.length;i++){const f=ok[i];$('#mtx').textContent=`Uploading ${i+1} of ${ok.length}: ${f.name}`;$('#mbar').style.width='0';try{const m=await upOne(f,p=>$('#mbar').style.width=p*100+'%');setMC(a=>a.concat(m));added++}catch(e){e&&toast(`${f.name}: ${e.message}`)}}MU=0;stale(/^queue/);added&&toast(`Uploaded ${added} file${added>1?'s':''}`);const c=C.get('media');c&&fillMedia(c.d)};

/* media toggle / delete: ONE version of each. Re-render from the cache every time. */
const afterMedia=()=>{const c=C.get('media');if(c)fillMedia(c.d)},TSEQ=new Map();
async function togMedia(id,on){const c=C.get('media');if(!c)return;
 const old=!!(c.d.find(m=>m.id==id)||{}).on,k=(TSEQ.get(id)||0)+1;TSEQ.set(id,k);
 const set=v=>{setMC(a=>a.map(m=>m.id==id?Object.assign({},m,{on:v}):m));afterMedia()};
 set(on);
 try{const r=await api('media/'+enc(id),'PATCH',{on});if(TSEQ.get(id)!==k)return;
  if(r&&typeof r.on=='boolean'&&r.on!==on)set(r.on);stale(/^queue/)}
 catch(e){if(TSEQ.get(id)===k)set(old);e&&toast(e.message)}}
async function rmMedia(id){if(!confirm('Delete this file? It will be removed from storage.'))return;
 try{await api('media/'+enc(id),'DELETE');setMC(a=>a.filter(m=>m.id!=id));BL.delete(id);TSEQ.delete(id);stale(/^queue/);afterMedia();toast('Deleted')}
 catch(e){e&&toast(e.message)}}

draw();go('dash');pollStatus()
