<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f4ee"><title>Vansh Lead</title>
<script src="static/lucide.js"></script>
<style>
:root{--bg:#f6f4ee;--sage:#7d8f6e;--sd:#3f4d37;--sl:#e1e8d8;--ink:#232a1f;--mut:#6f7866;--tom:#e5533d;--glass:rgba(255,255,255,.62);--ln:rgba(255,255,255,.8)}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    color: #1d1d1f;
    background: #f5f5f7;
    min-height: 100vh;
    font-feature-settings: "tnum";
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(560px 420px at 6% -4%,#d5dfc9,transparent 70%),radial-gradient(520px 400px at 100% 100%,#dfe7d5,transparent 70%)}
i[data-lucide],svg.lucide{width:18px;height:18px;stroke-width:1.8;flex:none}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--ln);border-radius:20px;box-shadow:0 1px 2px rgba(40,55,30,.05),0 12px 32px rgba(40,55,30,.07)}
nav{position:fixed;z-index:20;left:16px;top:16px;bottom:16px;width:216px;padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin:2px 10px 18px;letter-spacing:-.01em}
.logo{width:30px;height:30px;border-radius:10px;background:var(--sd);color:#fff;display:grid;place-items:center}.logo i,.logo svg{width:16px;height:16px}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--mut);font-weight:500;transition:.15s}
nav button:hover{background:rgba(255,255,255,.6)}nav button.on{background:var(--sl);color:var(--sd);font-weight:600}
main{margin-left:248px;padding:28px 28px 40px;max-width:1000px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}h1{font-size:26px;letter-spacing:-.02em;margin:0;font-weight:700}.sub{color:var(--mut);font-size:14px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14px;background:var(--tom);color:#fff;transition:.15s;text-align:center}
.btn:active{transform:scale(.97)}.btn.sage{background:var(--sd)}.btn.soft{background:var(--sl);color:var(--sd)}.btn.ghost{background:transparent;color:var(--mut);height:36px;font-weight:500}.btn.sm{height:34px;padding:0 12px;font-size:13px}.btn.block{width:100%}
input,select,textarea{font:inherit;color:var(--ink);width:100%;padding:11px 13px;border-radius:12px;border:1px solid rgba(63,77,55,.14);background:rgba(255,255,255,.75);outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--sage);box-shadow:0 0 0 4px rgba(125,143,110,.18)}label{font-size:13px;font-weight:600;color:var(--sd);display:block;margin:0 0 6px}
.field{margin-bottom:14px}.pad{padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:14px}
.stat{padding:16px}.stat .ico{width:36px;height:36px;border-radius:12px;background:var(--sl);color:var(--sd);display:grid;place-items:center;margin-bottom:12px}
.stat b{font-size:30px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.1}.stat span{color:var(--mut);font-size:13px}
.bar{height:8px;border-radius:9px;background:rgba(63,77,55,.1);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;border-radius:9px;background:var(--sage);transition:width .5s}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.tools .grow{flex:1 1 220px;position:relative}.grow svg,.grow i{position:absolute;left:13px;top:12px;color:var(--mut)}.grow input{padding-left:40px}
.list{padding:6px}.lead{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px}.lead+.lead{border-top:1px solid rgba(63,77,55,.07)}
.av{width:42px;height:42px;border-radius:14px;background:var(--sl);color:var(--sd);display:grid;place-items:center;font-weight:700;flex:none}
.lead .t{flex:1;min-width:0}.lead b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.lead small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-size:12px;font-weight:700;color:var(--sd);background:var(--sl);border-radius:8px;padding:2px 8px}.score.hi{background:var(--sd);color:#fff}
.chip{appearance:none;-webkit-appearance:none;width:auto;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(255,255,255,.8);cursor:pointer}
.focus{padding:24px;text-align:left}.focus h2{font-size:24px;margin:10px 0 4px;letter-spacing:-.02em}.meta{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:14px;margin:4px 0}
.preview{background:rgba(255,255,255,.7);border-radius:14px;padding:14px;margin:16px 0;font-size:14px;color:var(--ink);white-space:pre-wrap}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.acts .btn.block:first-child{grid-column:1/-1}
.empty{text-align:center;color:var(--mut);padding:44px 20px}.empty i,.empty svg{width:34px;height:34px;margin-bottom:10px;color:var(--sage)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.chips button{all:unset;cursor:pointer;padding:6px 12px;border-radius:99px;background:var(--sl);color:var(--sd);font-size:13px;font-weight:500}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--sl);border-top-color:var(--sd);animation:sp .8s linear infinite;flex:none}@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--sd);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60}#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}#toast button{all:unset;cursor:pointer;color:#ff9b8a;font-weight:700;margin-left:12px}
dialog{border:0;padding:0;background:transparent;max-width:520px;width:calc(100% - 24px);margin:auto}dialog::backdrop{background:rgba(35,42,31,.35);backdrop-filter:blur(6px)}dialog .glass{background:rgba(250,249,244,.92);padding:20px}
#login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg)}#login .glass{width:min(360px,90%);padding:26px}
.mbar{display:none}
@media(max-width:800px){
 nav{inset:auto 12px calc(12px + env(safe-area-inset-bottom)) 12px;width:auto;flex-direction:row;padding:6px;border-radius:24px;gap:2px;justify-content:space-between}.brand{display:none}
 nav button{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:8px 2px;justify-content:center;align-items:center;border-radius:18px}
 main{margin:0;padding:calc(14px + env(safe-area-inset-top)) 16px 110px}h1{font-size:23px}.grid{grid-template-columns:1fr 1fr;gap:12px}
 dialog{margin:auto 0 0;width:100%;max-width:none}dialog .glass{border-radius:26px 26px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom))}#toast{bottom:104px}}
.sheet{max-height:86vh;overflow:auto;overscroll-behavior:contain}.kv{display:flex;gap:12px;padding:11px 0;border-top:1px solid rgba(63,77,55,.08)}.kv>svg,.kv>i{color:var(--sage);margin-top:2px}
.kv small{display:block;color:var(--mut);font-size:12px}.kv a{color:var(--sd);word-break:break-all}.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:16px 0}
.tl{list-style:none;margin:0;padding:0}.tl li{display:flex;gap:12px;padding:7px 0;font-size:14px}.tl time{color:var(--mut);font-size:12px;min-width:48px;padding-top:2px}.tl .w{color:var(--tom)}
.acts3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}.chev{display:none;color:var(--mut)}.lead{cursor:pointer}.lead:hover{background:rgba(255,255,255,.55)}
@media(max-width:800px){.lead .rowact{display:none}.chev{display:block}}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.55);backdrop-filter:blur(14px);margin-bottom:14px}
.seg button{all:unset;flex:1;text-align:center;padding:9px 4px;border-radius:11px;font-weight:600;font-size:13px;cursor:pointer;color:var(--mut)}.seg .on{background:#fff;color:var(--sd);box-shadow:0 1px 5px rgba(40,55,30,.14)}
.pager{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.pager .btn{width:40px;padding:0}.pager b{font-size:14px}
.who{display:flex;gap:14px;align-items:center}.who .av{width:52px;height:52px;font-size:20px}.who h2{margin:0;font-size:21px;letter-spacing:-.02em}
.lbl{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 8px}
.bubble{background:#e4ecd9;border-radius:18px 18px 4px 18px;padding:12px 14px;font-size:14px;white-space:pre-wrap;margin-left:auto;max-width:94%}
.steps{display:flex;margin:20px 0 14px}.stp{flex:1;text-align:center;font-size:12px;color:var(--mut);font-weight:500;position:relative}
.stp .n{width:30px;height:30px;border-radius:50%;background:var(--sl);color:var(--sd);display:grid;place-items:center;margin:0 auto 6px;font-weight:700;font-size:13px}
.stp.on{color:var(--ink);font-weight:600}.stp.on .n{background:var(--sd);color:#fff}.stp.ok .n{background:var(--sage);color:#fff}
.big{height:52px;font-size:16px;border-radius:14px}.hint{text-align:center;color:var(--mut);font-size:13px;margin:10px 0 0}
.alt{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}</style></head><body>
<div id="login" hidden><div class="glass"><div class="brand" style="margin:0 0 20px"><span class="logo"><i data-lucide="map-pin"></i></span>Vansh Lead</div>
<div class="field"><label>Admin password</label><input id="pw" type="password" autocomplete="current-password" onkeydown="event.key=='Enter'&&login()"></div>
<p id="le" class="sub" style="color:var(--tom);margin:-6px 0 12px"></p><button class="btn block" onclick="login()">Sign in</button></div></div>
<nav class="glass"><div class="brand"><span class="logo"><i data-lucide="map-pin"></i></span>Vansh Lead</div></nav><main id="v"></main><div id="toast"></div>
<dialog id="dlg"><div class="glass"><h1 style="font-size:20px">Add businesses</h1><p class="sub">One per line as <b>Name, phone, type</b>, or paste JSON.</p>
<textarea id="addt" rows="6" placeholder="Ravi Realty, 98450 12345, real estate"></textarea>
<div class="tools" style="margin:14px 0 0;justify-content:flex-end"><button class="btn soft" onclick="dlg.close()">Cancel</button><button class="btn" onclick="addNow()">Add</button></div></div></dialog>
<dialog id="dlg2"><div class="glass sheet" id="pdc"></div></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=n=>`<i data-lucide="${n}"></i>`,draw=()=>lucide.createIcons(),ST=['new','messaged','replied','interested','not_interested','bad_number','do_not_contact'];
const TABS=[['dash','layout-dashboard','Home'],['leads','users','Leads'],['find','search','Find'],['runs','history','Runs'],['send','send','Send'],['set','settings','Settings']];let tab='dash',timer,skipped=new Set();
function toast(m,u){const t=$('#toast');window._u=u;t.innerHTML=esc(m)+(u?` <button onclick="_u();toast('Restored')">Undo</button>`:'');t.classList.add('on');clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove('on'),u?6000:2200)}
async function api(p,m='GET',b){const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
 if(r.status==401){$('#login').hidden=false;throw 0}const j=await r.json();if(!r.ok)throw new Error(j.error||'Something went wrong');return j}
async function login(){try{await api('login','POST',{password:$('#pw').value});$('#login').hidden=true;go('dash')}catch(e){$('#le').textContent=e.message||'Could not sign in'}}
$('nav').insertAdjacentHTML('beforeend',TABS.map(t=>`<button data-t="${t[0]}" onclick="go('${t[0]}')">${ic(t[1])}<span>${t[2]}</span></button>`).join(''));
const view=h=>{$('#v').innerHTML=h;draw()};const head=(t,s,a='')=>`<div class="top"><div><h1>${t}</h1><div class="sub">${s}</div></div>${a}</div>`;
function go(t){tab=t;clearInterval(timer);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));({dash,leads,find,runs,send,set})[t]().catch(e=>e&&toast(e.message))}
async function dash(){const s=await api('stats'),p=Math.min(100,s.sent_today/s.limit*100);
 const T=[['users','Total leads',s.total],['phone','With phone',s.with_phone],['send','Ready to message',s.ready],['message-circle','Contacted',s.contacted],['star','Replied or interested',s.warm]];
 view(head('Overview','Your outreach at a glance')+`<div class="glass pad" style="margin-bottom:14px"><div class="top" style="margin:0"><b>Sent today</b><span class="sub">${s.sent_today} of ${s.limit}</span></div><div class="bar"><i style="width:${p}%"></i></div></div>
 <div class="grid">${T.map(x=>`<div class="glass stat"><div class="ico">${ic(x[0])}</div><b>${x[2]}</b><span>${x[1]}</span></div>`).join('')}</div>
 <div class="tools"><button class="btn" onclick="go('send')">${ic('send')}Start sending</button><button class="btn soft" onclick="go('find')">${ic('search')}Find businesses</button></div>`)}
async function leads(){const q=$('#q')?.value||'',st=$('#st')?.value||'',m=$('#mo')?.dataset.on=='1'?1:0;const d=await api(`leads?q=${encodeURIComponent(q)}&status=${st}&mobile=${m}`);
 if(!$('#q'))view(head('Leads',`Everything you have collected`,`<button class="btn" onclick="dlg.showModal()">${ic('plus')}Add</button>`)+`<div class="tools"><div class="grow">${ic('search')}<input id="q" placeholder="Search name, phone or area" oninput="clearTimeout(window.t);window.t=setTimeout(leads,300)"></div>
 <select id="st" class="chip" style="height:42px" onchange="leads()"><option value="">All statuses</option>${ST.map(s=>`<option>${s}</option>`).join('')}</select>
 <button id="mo" class="btn soft" data-on="0" onclick="this.dataset.on=this.dataset.on=='1'?0:1;this.className='btn '+(this.dataset.on=='1'?'sage':'soft');leads()">${ic('smartphone')}Mobile only</button></div><div id="ll" class="glass list"></div>`);
 $('#ll').innerHTML=d.length?d.map(l=>`<div class="lead" onclick="openLead('${esc(l.id)}')"><div class="av">${esc(l.name[0]||'?').toUpperCase()}</div><div class="t"><b>${esc(l.name)}</b><small>${esc(l.category)} · ${esc(l.phone||'No phone')} · ${esc(l.outreach)}</small></div>
 <span class="score ${l.score>=70?'hi':''}">${l.score}</span><select class="chip rowact" onclick="event.stopPropagation()" onchange="upd('${esc(l.id)}',this.value)">${ST.map(s=>`<option ${s==l.outreach?'selected':''}>${s}</option>`).join('')}</select>
 <button class="btn ghost sm rowact" aria-label="Delete" onclick="event.stopPropagation();del('${esc(l.id)}')">${ic('trash-2')}</button><span class="chev">${ic('chevron-right')}</span></div>`).join(''):`<div class="empty">${ic('inbox')}<div>No leads match yet</div></div>`;draw()}
async function upd(id,o){await api('leads/'+encodeURIComponent(id),'PATCH',{outreach:o});toast('Status updated')}
async function del(id){if(confirm('Delete this lead?')){await api('leads/'+encodeURIComponent(id),'DELETE');toast('Deleted');leads()}}
async function addNow(){const t=$('#addt').value.trim();let b;try{b=JSON.parse(t)}catch{b=t.split('\n').map(l=>l.split(/[,|]/).map(x=>x.trim())).filter(p=>p.length>1).map(p=>({name:p[0],phone:p[1],category:p[2]}))}
 try{const r=await api('leads','POST',b);toast(`Added ${r.added}, updated ${r.updated}`+(r.warnings.length?`, ${r.warnings.length} warning(s)`:''));if(r.added||r.updated){$('#addt').value='';dlg.close();tab=='leads'&&leads()}}catch(e){toast(e.message)}}
const when=t=>t?new Date(t.replace(' ','T')).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const safe=u=>/^https?:\/\//i.test(u||'')?u:'',hm=t=>t?new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'';
dlg2.addEventListener('close',()=>clearInterval(window.rt));
let FS='scrape',FV={};const keep=()=>{FV={c:$('#fc')?.value,l:$('#fl')?.value,n:$('#fn')?.value,r:$('#fr')?.value}};
async function find(){const s=await api('settings'),T=[['scrape','Maps scraper'],['osm','OpenStreetMap'],['google','Google API']],
 D={scrape:'Free. Opens Google Maps in a hidden browser. Most complete, takes a few minutes.',osm:'Free. Open map data, fast, but many shops have no phone listed.',google:'Official Google Places. Free tier each month, then paid. Needs an API key.'};
 view(head('Find businesses','Pick a source, then search')+`<div class="seg">${T.map(t=>`<button class="${t[0]==FS?'on':''}" onclick="keep();FS='${t[0]}';find()">${t[1]}</button>`).join('')}</div>
 <div class="glass pad"><p class="sub" style="margin:0 0 16px">${D[FS]}</p><div class="field"><label>Business type</label><input id="fc" placeholder="${FS=='osm'?'real estate, pg, gym or shop=bakery':'e.g. real estate'}" value="${esc(FV.c||'')}">
 <div class="chips">${['real estate','pg','gym','clinic','salon'].map(c=>`<button onclick="fc.value='${c}'">${c}</button>`).join('')}</div></div>
 <div class="field"><label>Area and city</label><input id="fl" placeholder="Indiranagar, Bengaluru" value="${esc(FV.l??s.last_location)}"></div>
 <div class="field"><label>How many to keep (1 to 100)</label><input id="fn" type="number" inputmode="numeric" min="1" max="100" value="${esc(FV.n||20)}"><div class="chips">${[10,20,30,50].map(n=>`<button onclick="fn.value=${n}">${n}</button>`).join('')}</div></div>
 ${FS!='scrape'?`<div class="field"><label>Search radius in km (1 to 50)</label><input id="fr" type="number" inputmode="numeric" min="1" max="50" value="${esc(FV.r||5)}"><div class="chips">${[2,5,10,20].map(n=>`<button onclick="fr.value=${n}">${n} km</button>`).join('')}</div></div>`:''}
 ${FS=='google'?`<div class="field"><label>Google API key</label><input id="fk" type="password" autocomplete="off" placeholder="${s.has_google_key?'Saved. Leave empty to keep it':'Paste your key'}">
 <div class="bar"><i style="width:${Math.min(100,s.google_used/s.google_cap*100)}%"></i></div><p class="sub" style="margin:6px 0 0">${s.google_used} of ${s.google_cap} calls used this month. Search stops at the cap.</p></div>`:''}
 <button class="btn block" onclick="startFind()">${ic('search')}Start search</button></div><div id="jm"></div>`);poll();timer=setInterval(poll,2000)}
async function startFind(){const n=parseInt($('#fn').value);if(!(n>=1&&n<=100))return toast('Enter a number from 1 to 100');
 try{await api('find','POST',{source:FS,category:$('#fc').value,location:$('#fl').value,n,radius_km:$('#fr')?.value,api_key:$('#fk')?.value});poll()}catch(e){toast(e.message)}}
async function poll(){const j=await api('job'),b=$('#jm');if(!b)return;if(j.msg=='idle'){b.innerHTML='';return}const pct=j.total?Math.round(j.done/j.total*100):0;
 b.innerHTML=`<div class="glass pad" style="margin-top:14px"><div class="top" style="margin:0 0 12px"><div style="display:flex;gap:10px;align-items:center">${j.running?'<div class="spinner"></div>':ic('check-circle-2')}<b>${esc(j.running?j.phase||'Working':'Finished')}</b></div><span class="sub">${j.running&&j.total?pct+'%':''}</span></div>
 <div class="bar"><i style="width:${j.running?(j.total?pct:6):100}%"></i></div><div class="grid" style="margin:14px 0 0;grid-template-columns:repeat(3,1fr)">${[['Collected',j.collected||0],['Skipped',j.skipped||0],['Checked',(j.done||0)+'/'+(j.total||'-')]].map(x=>`<div><b style="font-size:22px">${x[1]}</b><div class="sub">${x[0]}</div></div>`).join('')}</div>
 <p class="sub" style="margin:12px 0 0">${esc(j.msg)}</p>${j.run_id?`<button class="btn soft sm" style="margin-top:10px" onclick="go('runs')">${ic('history')}View run log</button>`:''}</div>`;draw()}
async function runs(){clearInterval(timer);const d=await api('runs');
 view(head('Runs','Every search and what happened')+(d.length?`<div class="glass list">${d.map(r=>`<div class="lead" onclick="openRun(${r.id})"><div class="av">${ic(r.status=='running'?'loader':r.status=='failed'?'alert-circle':'check')}</div><div class="t"><b>${esc(r.query)}${r.location?' in '+esc(r.location):''}</b>
 <small>${esc(when(r.at))} · ${r.fetched} found · ${r.added} new${r.source!='scrape'?' · '+esc(r.source):''}</small></div><span class="score ${r.status=='running'?'hi':''}">${esc(r.status||'done')}</span><span class="chev">${ic('chevron-right')}</span></div>`).join('')}</div>`:`<div class="glass empty">${ic('history')}<div>No runs yet. Start one from Find.</div></div>`));
 if(d.some(r=>r.status=='running'))timer=setInterval(()=>tab=='runs'&&runs(),3000)}
async function openRun(id){const {run:r,events:e}=await api('runs/'+id);
 $('#pdc').innerHTML=`<h1 style="font-size:20px">${esc(r.query)}${r.location?' in '+esc(r.location):''}</h1><div class="sub">${esc(when(r.at))} · ${esc(r.status||'done')}${r.finished_at?' · finished '+esc(when(r.finished_at)):''}</div>
 <div class="grid" style="margin:16px 0;grid-template-columns:repeat(4,1fr)">${[['Asked',r.requested||'-'],['Found',r.fetched],['New',r.added],['Updated',r.changed]].map(x=>`<div><b style="font-size:22px">${x[1]}</b><div class="sub">${x[0]}</div></div>`).join('')}</div>
 ${r.error?`<p class="sub" style="color:var(--tom)">${esc(r.error)}</p>`:''}<label>Events</label><ul class="tl">${e.length?e.slice().reverse().map(x=>`<li><time>${hm(x.at)}</time><span class="${x.kind=='warn'?'w':''}">${esc(x.text)}</span></li>`).join(''):'<li class="sub">No events recorded for this run.</li>'}</ul>
 <button class="btn soft block" style="margin-top:12px" onclick="dlg2.close()">Close</button>`;
 if(!dlg2.open)dlg2.showModal();clearInterval(window.rt);if(r.status=='running')window.rt=setInterval(()=>dlg2.open&&openRun(id),2500)}
async function openLead(id){const l=await api('leads/'+encodeURIComponent(id)),w=safe(l.website),m=safe(l.maps_url);
 const kv=(i,k,v)=>v?`<div class="kv">${ic(i)}<div><small>${k}</small>${v}</div></div>`:'';
 $('#pdc').innerHTML=`<div style="display:flex;gap:14px;align-items:center"><div class="av" style="width:54px;height:54px;font-size:20px">${esc(l.name[0]||'?').toUpperCase()}</div><div style="min-width:0"><h1 style="font-size:20px">${esc(l.name)}</h1><div class="sub">${esc(l.category)} · score ${l.score}</div></div></div>
 <div class="qa">${l.link?`<a class="btn" target="_blank" rel="noopener" href="${esc(l.link)}">${ic('message-circle')}WhatsApp</a>`:''}${l.phone?`<a class="btn soft" href="tel:${esc(l.phone)}">${ic('phone')}Call</a>`:''}${m?`<a class="btn soft" target="_blank" rel="noopener" href="${esc(m)}">${ic('map')}Map</a>`:''}${w?`<a class="btn soft" target="_blank" rel="noopener" href="${esc(w)}">${ic('globe')}Website</a>`:''}</div>
 <div class="field"><label>Status</label><select id="ps">${ST.map(s=>`<option ${s==l.outreach?'selected':''}>${s}</option>`).join('')}</select></div>
 ${kv('smartphone','Phone',l.phone?esc(l.phone)+(l.is_mobile?' (mobile, WhatsApp-ready)':' (landline)'):'')}${kv('mail','Email',l.email?`<a href="mailto:${esc(l.email)}">${esc(l.email)}</a>`:'')}${kv('globe','Website',w?`<a target="_blank" rel="noopener" href="${esc(w)}">${esc(w)}</a>`:'')}
 ${kv('map-pin','Address',esc(l.address))}${kv('star','Rating',l.rating?esc(l.rating)+' from '+esc(l.reviews||0)+' reviews':'')}${kv('database','Source',esc(l.source)+' · '+esc(l.status||'active'))}
 ${kv('calendar','First seen',esc(when(l.first_seen)))}${kv('refresh-cw','Last seen',esc(when(l.last_seen)))}${kv('message-circle','Last contacted',esc(when(l.contacted_at)))}
 <div class="field" style="margin-top:12px"><label>Notes</label><textarea id="pn" rows="3">${esc(l.notes)}</textarea></div>
 ${l.changes.length?`<label>Recent changes</label><ul class="tl">${l.changes.map(c=>`<li><time>${esc(when(c.at))}</time><span>${esc(c.field)}: ${esc(c.old||'empty')} to ${esc(c.new||'empty')}</span></li>`).join('')}</ul>`:''}
 <div class="tools" style="margin:14px 0 0"><button class="btn" onclick="saveLead('${esc(l.id)}')">Save</button><button class="btn soft" onclick="dlg2.close()">Close</button><button class="btn ghost" onclick="dlg2.close();del('${esc(l.id)}')">${ic('trash-2')}Delete</button></div>`;
 dlg2.showModal();draw()}
async function saveLead(id){try{await api('leads/'+encodeURIComponent(id),'PATCH',{outreach:$('#ps').value,notes:$('#pn').value});dlg2.close();toast('Saved');tab=='leads'&&leads()}catch(e){toast(e.message)}}
let Q=[],qi=0,QM={};
async function send(keep){const q=await api('queue');Q=q.items;QM=q;if(!keep)qi=0;if(qi>=Q.length)qi=0;drawSend()}
function step(d){qi=(qi+d+Q.length)%Q.length;drawSend()}
const OP=new Set();
function drawSend(){const q=QM,p=Math.min(100,q.used/q.limit*100),l=Q[qi],prev=l?decodeURIComponent(l.link.split('text=')[1]||''):'',op=l&&OP.has(l.id);
 view(head('Send','Three taps per lead')+`<div class="glass pad" style="margin-bottom:14px;padding:14px 18px"><div class="top" style="margin:0"><b>Sent today</b><span class="sub">${q.used} of ${q.limit}</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`+
 (l?`<div class="glass focus"><div class="pager"><button class="btn soft" aria-label="Previous" onclick="step(-1)">${ic('chevron-left')}</button><b>Lead ${qi+1} of ${Q.length}</b><button class="btn soft" aria-label="Skip to next" onclick="step(1)">${ic('chevron-right')}</button></div>
 <div class="who"><div class="av">${esc(l.name[0]||'?').toUpperCase()}</div><div style="min-width:0"><h2>${esc(l.name)}</h2><div class="sub">${esc(l.category)} · ${esc(l.phone)}</div></div></div>
 <div class="lbl">Message you will send</div><div class="bubble">${esc(prev)}</div><div style="text-align:right"><button class="btn ghost sm" onclick="go('set')">${ic('pencil')}Edit message</button></div>
 <div class="steps"><div class="stp ${op?'ok':'on'}"><div class="n">${op?ic('check'):1}</div>Open WhatsApp</div><div class="stp ${op?'on':''}"><div class="n">2</div>Press send there</div><div class="stp"><div class="n">3</div>Mark as sent</div></div>`+
 (op?`<button class="btn sage block big" onclick="mark('${esc(l.id)}','messaged')">${ic('check')}Done, I sent it</button><p class="hint">Back from WhatsApp? Tap above. <a href="${esc(l.link)}" target="_blank" rel="noopener" style="color:var(--sd);font-weight:600">Open again</a></p>`
 :`<a class="btn block big" target="_blank" rel="noopener" href="${esc(l.link)}" onclick="OP.add('${esc(l.id)}');setTimeout(drawSend,500)">${ic('message-circle')}Open WhatsApp</a><p class="hint">The message is already typed for you.</p>`)+
 `<div class="alt"><button class="btn ghost sm" onclick="mark('${esc(l.id)}','bad_number')">${ic('phone-off')}Wrong number</button><button class="btn ghost sm" onclick="mark('${esc(l.id)}','do_not_contact')">${ic('ban')}Don't contact</button></div></div>
 <p class="hint">Use the arrows to skip. Skipped leads come back around.</p>`
 :`<div class="glass empty">${ic('party-popper')}<div>${q.used>=q.limit?'Daily limit reached. Rest now and continue tomorrow.':'No leads ready. Use Find to get more.'}</div></div>`))}
async function mark(id,o){await api('leads/'+encodeURIComponent(id),'PATCH',{outreach:o});toast(o=='messaged'?'Marked as sent':'Updated',async()=>{await api('leads/'+encodeURIComponent(id),'PATCH',{outreach:'new'});send(true)});send(true)}
async function set(){const s=await api('settings');view(head('Settings','Message and daily limit')+`<div class="glass pad"><div class="field"><label>Message template</label><textarea id="tp" rows="5">${esc(s.template)}</textarea>
 <p class="sub" style="margin:6px 0 0">Use {name} and {category}. Say who you are and add a reply STOP opt-out.</p></div>
 <div class="field"><label>Daily limit</label><input id="dl" type="number" min="1" max="100" value="${esc(s.daily_limit)}"></div>
 <div class="tools" style="margin:0"><button class="btn" onclick="saveSet()">Save changes</button><button class="btn soft" onclick="api('logout','POST').then(()=>location.reload())">${ic('log-out')}Log out</button></div></div>`)}
async function saveSet(){try{await api('settings','PUT',{template:$('#tp').value,daily_limit:$('#dl').value});toast('Saved')}catch(e){toast(e.message)}}
draw();api('stats').then(()=>go('dash')).catch(()=>{})
</script></body></html>
