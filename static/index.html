<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f4ee"><title>Vansh Lead</title>
<script src="/static/lucide.js?v=0.0.3"></script>
<link rel="stylesheet" href="/static/css/base.css?v=0.0.3">
<link rel="stylesheet" href="/static/css/layout.css?v=0.0.3">
<link rel="stylesheet" href="/static/css/dash.css?v=0.0.3">
<link rel="stylesheet" href="/static/css/leads.css?v=0.0.3">
<link rel="stylesheet" href="/static/css/send.css?v=0.0.3">

</head><body>
<div id="login" hidden><div class="glass"><div class="brand" style="margin:0 0 20px"><span class="logo"><i data-lucide="map-pin"></i></span>Vansh Lead</div>
<div class="field"><label>Admin password</label><input id="pw" type="password" autocomplete="current-password" onkeydown="event.key=='Enter'&&login()"></div>
<p id="le" class="sub" style="color:var(--tom);margin:-6px 0 12px"></p><button class="btn block" onclick="login()">Sign in</button></div></div>
<nav class="glass"><div class="brand"><span class="logo"><i data-lucide="map-pin"></i></span>Vansh Lead</div></nav>
<button id="wpill" data-a="go" data-v="set" aria-label="WhatsApp status, open settings" hidden></button>
<main id="v"><section class="pg" id="p-dash" hidden></section><section class="pg" id="p-leads" hidden></section><section class="pg" id="p-find" hidden></section><section class="pg" id="p-runs" hidden></section><section class="pg" id="p-send" hidden></section><section class="pg" id="p-set" hidden></section></main><div id="lsel" class="glass selbar" hidden></div><div id="toast" popover="manual"></div>
<datalist id="cats"><option value="real estate"><option value="pg"><option value="gym"><option value="clinic"><option value="salon"><option value="restaurant"><option value="school"><option value="shop"></datalist>
<dialog id="dlg" class="wide"><div class="glass sheet" id="adc"></div></dialog>
<dialog id="dlg2"><div class="glass sheet" id="pdc"></div></dialog>
<script src="/static/js/core.js?v=0.0.3"></script>
<script src="/static/js/nav.js?v=0.0.3"></script>
<script src="/static/js/status.js?v=0.0.3"></script>

<script src="/static/js/leads.js?v=0.0.3"></script>
<script src="/static/js/add.js?v=0.0.3"></script>
<script src="/static/js/find.js?v=0.0.3"></script>
<script src="/static/js/runs.js?v=0.0.3"></script>
<script src="/static/js/send.js?v=0.0.3"></script>
<script src="/static/js/settings.js?v=0.0.3"></script>
<script src="/static/js/media.js?v=0.0.3"></script>
<script src="/static/js/app.js?v=0.0.3"></script>
</body></html>
